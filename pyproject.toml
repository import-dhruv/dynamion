[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynamion"
version = "0.1.0"
description = "A long-horizon software-engineering evaluation harness for coding agents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Dhruv" }]
keywords = ["benchmark", "evaluation", "coding-agents", "llm", "swe"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "hypothesis>=6.100",
]

[project.scripts]
dynamion = "dynamion.cli:main"

[project.urls]
Homepage = "https://github.com/import-dhruv/dynamion"
Repository = "https://github.com/import-dhruv/dynamion"
Issues = "https://github.com/import-dhruv/dynamion/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamion"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tasks", "/README.md", "/CONTRIBUTING.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tasks/**" = ["ALL"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["yaml", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "docker: test requires a working Docker daemon",
  "slow: test takes more than a minute",
]
