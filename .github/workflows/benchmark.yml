name: Benchmark

# Re-runs the benchmark when an adapter changes, when a task changes, or
# on a schedule. Scores are published to the Pages leaderboard.
#
# Agents that require credentials are opt-in: the workflow runs the local
# model by default so it is reproducible and free, and a maintainer adds
# secrets-backed agents deliberately rather than leaking keys to forks.

on:
  push:
    branches: [main]
    paths:
      - "src/dynamion/runners/**"
      - "src/dynamion/graders/**"
      - "src/dynamion/env/**"
      - "tasks/**"
      - "agents/**"
  schedule:
    # Monthly. Catches base-image drift even when nothing in the repo
    # changed, which is exactly when a digest pin is doing its job.
    - cron: "17 4 1 * *"
  workflow_dispatch:
    inputs:
      agents:
        description: "Agent configs to run (space-separated names)"
        default: "aider-local"
        required: false

concurrency:
  group: benchmark-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install harness
        run: pip install -e ".[dev]"

      - name: Validate task specs
        run: dynamion validate --tasks-dir tasks

      # Ollama serving the local model, so the default agent needs no
      # API key and the run is reproducible for anyone who clones it.
      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          for _ in $(seq 1 30); do
            curl -sf http://localhost:11434/api/tags >/dev/null && break
            sleep 2
          done
          ollama pull qwen2.5-coder:7b

      - name: Install Aider
        run: pip install aider-install && ~/.local/bin/aider --version

      - name: Run benchmark
        env:
          DYNAMION_AGENTS: ${{ inputs.agents }}
        run: |
          AGENTS="${DYNAMION_AGENTS:-aider-local}"
          echo "agents: $AGENTS"
          mkdir -p "$HOME/dynamion-ws"
          dynamion bench \
            --tasks-dir tasks \
            --agents-dir agents \
            --results-dir results \
            --agents $AGENTS \
            --env docker \
            --allow-host host.docker.internal

      - name: Upload run records
        uses: actions/upload-artifact@v4
        with:
          name: run-records
          path: results/runs/
          retention-days: 90

      - name: Render leaderboard site
        run: python -m dynamion.site --results results/leaderboard.json --out site

      - name: Commit updated leaderboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site results/leaderboard.json
          git diff --staged --quiet || \
            git commit -m "chore: update leaderboard [skip ci]"
          git push || echo "push skipped (fork or protected branch)"

      - name: Deploy to Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish
        if: github.ref == 'refs/heads/main'
        uses: actions/deploy-pages@v4
